<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">逻辑架构总图</title>
  <desc id="desc">OME 与 SGLang 在 Kubernetes 集群中的逻辑架构、控制面、GPU Worker、OME 资源和 OpenAI 兼容入口关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .small { font-size: 8px; }
      .tiny { font-size: 7px; }
      .cluster-label { font-size: 8px; fill: #475569; }
      .edge-label { font-size: 8px; fill: #475569; }
      .outer { fill: #fffef0; stroke: #a3a30a; stroke-width: 1.5; }
      .nodes { fill: #ffffff; stroke: #64748b; stroke-width: 1; }
      .node-area { fill: #fafafa; stroke: #374151; stroke-width: 1.5; }
      .resource-area { fill: #fffbea; stroke: #d97706; stroke-width: 1; }
      .controller { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.2; }
      .gateway { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .engine { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .resource { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
      .external { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; }
      .operator { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 1.2; }
      .solid { fill: none; stroke: #334155; stroke-width: 1.2; marker-end: url(#arrow); }
      .solid-strong { fill: none; stroke: #111827; stroke-width: 1.8; marker-end: url(#arrow); }
      .dotted { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2 3; marker-end: url(#arrow-muted); }
      .label-bg { fill: rgba(255,255,255,0.86); stroke: none; }
    </style>
  </defs>

